<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据下行</title>
    <style>
        :root { --bg:#edf4f7; --panel:#fff; --line:#d6e1e8; --text:#1f2937; --muted:#6b7280; --accent:#0f766e; --soft:#def7ec; --danger:#b42318; --shadow:0 18px 40px rgba(15,23,42,.08); }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; padding:28px 18px; color:var(--text); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(circle at top right,rgba(15,118,110,.14),transparent 30%),linear-gradient(180deg,#f9fcfd 0%,var(--bg) 100%); }
        .shell { max-width:1280px; margin:0 auto; }
        .hero,.panel-header,.endpoint-title,.actions { display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .hero { align-items:flex-start; margin-bottom:20px; }
        h1 { margin:0 0 8px; font-size:30px; } h2 { margin:0; font-size:18px; } p { margin:0; color:var(--muted); }
        .nav { display:flex; gap:10px; flex-wrap:wrap; }
        .link { display:inline-flex; align-items:center; height:38px; padding:0 14px; color:var(--text); text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:10px; }
        .layout { display:grid; grid-template-columns:300px 1fr; gap:18px; }
        .panel { background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
        .panel-header { padding:18px 20px; border-bottom:1px solid var(--line); }
        .muted { color:var(--muted); font-size:13px; }
        .endpoint-list { padding:10px; max-height:720px; overflow:auto; }
        .endpoint { width:100%; padding:14px; text-align:left; color:inherit; background:transparent; border:1px solid transparent; border-radius:14px; cursor:pointer; }
        .endpoint:hover { background:rgba(15,118,110,.06); } .endpoint.active { background:var(--soft); border-color:rgba(15,118,110,.22); }
        .endpoint strong,.endpoint span { display:block; } .endpoint span { margin-top:5px; color:var(--muted); font-size:12px; word-break:break-all; }
        .empty { padding:32px 18px; color:var(--muted); text-align:center; }
        .content { display:grid; gap:18px; }
        .form-body { padding:20px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
        .field { display:grid; gap:7px; } .field.full { grid-column:1/-1; }
        label { font-size:14px; font-weight:600; }
        input,select,textarea,button { font:inherit; }
        input,select,textarea { width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; padding:10px 12px; color:var(--text); }
        textarea { min-height:112px; resize:vertical; font-family:Consolas,"Courier New",monospace; line-height:1.5; }
        .hint { color:var(--muted); font-size:12px; }
        .actions { grid-column:1/-1; justify-content:flex-end; }
        button.primary { min-width:120px; height:40px; padding:0 18px; color:#fff; border:0; border-radius:10px; cursor:pointer; background:linear-gradient(135deg,#0f766e,#0ea5a0); }
        button:disabled { opacity:.55; cursor:not-allowed; }
        .history { padding:0 20px 20px; display:grid; gap:10px; }
        .result { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:12px; background:#f8fafc; }
        .result.error { border-left-color:var(--danger); } .result-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:13px; }
        pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12px/1.5 Consolas,"Courier New",monospace; }
        @media(max-width:900px){.layout{grid-template-columns:1fr}.endpoint-list{max-height:280px}} @media(max-width:640px){body{padding:18px 12px}.hero{flex-direction:column}.form-body{grid-template-columns:1fr}.field.full,.actions{grid-column:auto}}
    </style>
</head>
<body>
<div class="shell">
    <div class="hero">
        <div><h1>数据下行</h1><p>向当前在线的遥测站发送控制命令，并查看设备响应。</p></div>
        <div class="nav"><a class="link" href="/private/dashboard.html">消息中心</a><a class="link" href="/logout">退出登录</a></div>
    </div>
    <div class="layout">
        <aside class="panel">
            <div class="panel-header"><h2>在线设备</h2><span class="muted" id="endpointCount">0 台</span></div>
            <div class="endpoint-list" id="endpointList"><div class="empty">正在读取在线设备...</div></div>
        </aside>
        <main class="content">
            <section class="panel">
                <div class="panel-header"><h2>通用十六进制下行</h2><span class="muted" id="selectedLabel">未选择设备</span></div>
                <form class="form-body" id="rawForm">
                    <div class="field"><label for="functionType">功能码</label><input id="functionType" value="0x4C" required><span class="hint">支持十进制或 0x 前缀十六进制</span></div>
                    <div class="field"><label for="frameControlType">报文控制符</label><select id="frameControlType"><option value="5">ENQ (0x05)</option><option value="4">EOT (0x04)</option><option value="27">ESC (0x1B)</option></select></div>
                    <div class="field full"><label for="payloadHex">正文十六进制</label><textarea id="payloadHex" placeholder="例如：00002608111200000101" required></textarea><span class="hint">可包含空格和换行；正文需包含协议要求的流水号等字段。</span></div>
                    <div class="field"><label for="rawTimeout">响应超时（秒）</label><input id="rawTimeout" type="number" min="1" max="300" value="30" required></div>
                    <div class="actions"><button class="primary" type="submit">发送通用下行</button></div>
                </form>
            </section>
            <section class="panel">
                <div class="panel-header"><h2>泵站控制</h2><span class="muted">功能码 0x4C</span></div>
                <form class="form-body" id="pumpForm">
                    <div class="field"><label for="pumpCommand">控制命令</label><select id="pumpCommand"><option value="1">开启（1）</option><option value="0">关闭（0）</option></select></div>
                    <div class="field"><label for="pumpTimeout">响应超时（秒）</label><input id="pumpTimeout" type="number" min="1" max="300" value="30" required></div>
                    <div class="actions"><button class="primary" type="submit">发送泵站控制</button></div>
                </form>
            </section>
            <section class="panel">
                <div class="panel-header"><h2>最近结果</h2><button type="button" class="link" id="clearHistory">清空</button></div>
                <div class="history" id="history"><div class="empty">本次会话还没有发送记录。</div></div>
            </section>
        </main>
    </div>
</div>
<script>
    let endpointId = new URLSearchParams(location.search).get('id');
    let endpoints = [];
    const list = document.getElementById('endpointList');
    const count = document.getElementById('endpointCount');
    const selectedLabel = document.getElementById('selectedLabel');
    const historyPanel = document.getElementById('history');
    const functionTypeInput = document.getElementById('functionType');
    const frameControlInput = document.getElementById('frameControlType');
    const payloadHexInput = document.getElementById('payloadHex');
    const rawTimeoutInput = document.getElementById('rawTimeout');
    const pumpCommandInput = document.getElementById('pumpCommand');
    const pumpTimeoutInput = document.getElementById('pumpTimeout');
    const records = [];

    function escapeHtml(value) { return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function renderEndpoints() {
        count.textContent = `${endpoints.length} 台`;
        selectedLabel.textContent = endpointId ? `Endpoint: ${endpointId}` : '未选择设备';
        if (!endpoints.length) { list.innerHTML = '<div class="empty">当前没有在线设备。</div>'; return; }
        list.innerHTML = endpoints.map(item => `<button class="endpoint ${item.endpointId === endpointId ? 'active' : ''}" data-id="${escapeHtml(item.endpointId)}"><strong>${escapeHtml(item.endpointId)}</strong><span>${escapeHtml(item.remoteAddress || '-')}</span><span>连接时间：${escapeHtml(item.connectedAt || '-')}</span></button>`).join('');
        list.querySelectorAll('.endpoint').forEach(button => button.onclick = () => selectEndpoint(button.dataset.id));
    }
    function selectEndpoint(id) {
        endpointId = id; const url = new URL(location.href); url.searchParams.set('id', id); window.history.replaceState({},'',url); renderEndpoints();
    }
    async function fetchEndpoints() {
        try {
            const response = await fetch('/private/online-endpoints');
            if (response.status === 401) { location.href='/static/login.html'; return; }
            if (!response.ok) throw new Error(await response.text() || '读取在线设备失败');
            endpoints = await response.json();
            if (endpointId && !endpoints.some(item => item.endpointId === endpointId)) endpointId = null;
            if (!endpointId && endpoints.length) endpointId = endpoints[0].endpointId;
            renderEndpoints();
        } catch (error) { count.textContent='读取失败'; list.innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`; }
    }
    function parseNumber(value, name) {
        const text = String(value).trim(); const number = /^0x/i.test(text) ? parseInt(text.substring(2),16) : parseInt(text,10);
        if (!Number.isInteger(number)) throw new Error(`${name}格式不正确`); return number;
    }
    async function send(path, payload, button, title) {
        if (!endpointId) { addResult(title, false, {error:'请先选择在线设备'}); return; }
        button.disabled=true; const original=button.textContent; button.textContent='发送中...';
        try {
            const response = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,endpointId})});
            const result = await response.json().catch(async()=>({error:await response.text()}));
            addResult(title,response.ok,result);
            if (response.status === 404) fetchEndpoints();
        } catch (error) { addResult(title,false,{error:error.message || '网络请求失败'}); }
        finally { button.disabled=false; button.textContent=original; }
    }
    function addResult(title, success, data) {
        records.unshift({title,success,data,time:new Date().toLocaleString()}); records.splice(20); renderHistory();
    }
    function renderHistory() {
        if (!records.length) { historyPanel.innerHTML='<div class="empty">本次会话还没有发送记录。</div>'; return; }
        historyPanel.innerHTML=records.map(item=>`<article class="result ${item.success?'':'error'}"><div class="result-head"><strong>${escapeHtml(item.title)} · ${item.success?'成功':'失败'}</strong><span>${escapeHtml(item.time)}</span></div><pre>${escapeHtml(JSON.stringify(item.data,null,2))}</pre></article>`).join('');
    }
    document.getElementById('rawForm').onsubmit = event => { event.preventDefault(); try { send('/private/downstream/raw',{functionType:parseNumber(functionTypeInput.value,'功能码'),frameControlType:Number(frameControlInput.value),payloadHex:payloadHexInput.value,timeout:Number(rawTimeoutInput.value)},event.submitter,'通用下行'); } catch(error){ addResult('通用下行',false,{error:error.message}); } };
    document.getElementById('pumpForm').onsubmit = event => { event.preventDefault(); send('/private/downstream/pump-control',{command:Number(pumpCommandInput.value),timeout:Number(pumpTimeoutInput.value)},event.submitter,'泵站控制'); };
    document.getElementById('clearHistory').onclick=()=>{records.length=0;renderHistory();};
    fetchEndpoints(); setInterval(fetchEndpoints,10000);
</script>
</body>
</html>

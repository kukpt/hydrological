<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>端点调试 - Vert.x</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .controls { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #fafafa; }
        .status-tag { padding: 2px 8px; border-radius: 4px; background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
        code {
            white-space: pre-wrap;      /* 保留空格并自动换行 */
            background: #f5f5f5;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 13px;
            color: #c41d7f;            /* 给报文换个颜色，醒目一些 */
        }
        td {
            word-break: break-all;      /* 强制在任何字符间换行 */
            overflow-wrap: break-word; /* 兼容性处理 */
            max-width: 400px;          /* 建议给 payload 列设置一个最大宽度，防止撑得太开 */
            vertical-align: top;       /* 顶端对齐，方便阅读长文本 */
        }
    </style>
</head>
<body>

<div class="card">
    <div class="controls">
        <h2 id="title">调试端点: --</h2>
        <button onclick="triggerDebug()" style="background: #1890ff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">发送调试指令</button>
        <button onclick="stopDebug()" style="background: #ff4d4f; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">关闭调试</button>
        <label>自动刷新间隔：</label>
        <select id="refreshInterval" onchange="updateTimer()">
            <option value="0">关闭</option>
            <option value="5000">5秒</option>
            <option value="10000">10秒</option>
        </select>
        <a href="/private/dashboard.html">返回列表</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Type</th>
            <th>Payload</th>
            <th>Recorded Time</th>
            <th>Endpoint ID</th>
            <th>Remote Addr</th>
        </tr>
        </thead>
        <tbody id="log-body">
        </tbody>
    </table>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const endpointId = urlParams.get('id');
    let timer = null;

    document.getElementById('title').innerText = `调试端点: ${endpointId}`;

    // 1. 发送调试指令
    async function triggerDebug() {
        try {
            const response = await fetch(`/private/debug?endpointId=${endpointId}`, { method: 'POST' });
            if (response.ok) alert('调试指令已下发');
            else alert('下发失败');
        } catch (e) { console.error(e); }
    }
    async function stopDebug() {
        if (!confirm('确定要关闭对端点 ' + endpointId + ' 的调试吗？')) return;

        try {
            const response = await fetch(`/private/debug/stop?endpointId=${endpointId}`, { method: 'POST' });
            if (response.ok) {
                alert('调试模式已关闭');
            } else {
                alert('操作失败');
            }
        } catch (e) {
            console.error('Request failed', e);
        }
    }
    // 2. 获取日志数据
    async function fetchLogs() {
        const tbody = document.getElementById('log-body');
        try {
            const response = await fetch(`/private/trafficMonitor?endpointId=${endpointId}`);
            if (response.status === 401) { window.location.href = '/static/login.html'; return; }

            const data = await response.json();
            tbody.innerHTML = data.map(log => `
                <tr>
                    <td><span class="status-tag">${log.type}</span></td>
                    <td style="font-family: monospace;"><code>${log.payload}</code></td>
                    <td>${log.recordedTime}</td>
                    <td>${log.endpointId}</td>
                    <td>${log.remoteAddr}</td>
                </tr>
            `).join('');
        } catch (e) { console.error(e); }
    }

    // 3. 定时器管理
    function updateTimer() {
        if (timer) clearInterval(timer);
        const interval = parseInt(document.getElementById('refreshInterval').value);
        if (interval > 0) {
            timer = setInterval(fetchLogs, interval);
        }
    }

    window.onload = () => {
        fetchLogs();
        // 默认可设置为 5秒 刷新
        document.getElementById('refreshInterval').value = "5000";
        updateTimer();
    };
</script>
</body>
</html>
